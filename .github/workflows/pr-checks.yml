name: PR Checks

on:
  pull_request:
    branches: ['**']

jobs:
  root-repo:
    name: Root Repository Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run Lint
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test:coverage

  config-service:
    name: Config Service Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: config-service
        run: npm install

      - name: Run Lint
        working-directory: config-service
        run: npm run lint

      - name: Check Formatting
        working-directory: config-service
        run: npm run format:check

      - name: Run Tests with Coverage
        working-directory: config-service
        run: npm run test:coverage
