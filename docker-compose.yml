# docker-compose.yml
version: '3.8'

services:
  config-service:
    build:
      context: ./config-service
      dockerfile: Dockerfile
    container_name: config-service
    environment:
      - PORT=3001
      - CONFIG_FILE=/data/config.json
      # IMPORTANT: Set a strong admin token in production!
      - MEETINGS_CONFIG_ADMIN_TOKEN=${MEETINGS_CONFIG_ADMIN_TOKEN:-default-admin-token-change-me}
      # Initialize with these values (can be overridden via .env file)
      - VITE_HOST=${VITE_HOST:-}
      - VITE_BASENAME=${VITE_BASENAME:-}
      - VITE_BACKEND_HOST=${VITE_BACKEND_HOST:-}
      - VITE_ENABLE_RECORDING=${VITE_ENABLE_RECORDING:-false}
      - VITE_ENABLE_CLOSED_CAPTION=${VITE_ENABLE_CLOSED_CAPTION:-false}
      - VITE_DEFAULT_THEME=${VITE_DEFAULT_THEME:-default}
      - VITE_TURN_SERVER_URL=${VITE_TURN_SERVER_URL:-}
      - VITE_TURN_SERVER_USERNAME=${VITE_TURN_SERVER_USERNAME:-}
      - VITE_TURN_SERVER_CREDENTIAL=${VITE_TURN_SERVER_CREDENTIAL:-}
      - VITE_NODE_GROUP=${VITE_NODE_GROUP:-}
      - VITE_LOGO_URL=${VITE_LOGO_URL:-}
    volumes:
      - config-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: react-nginx
    ports:
      - '3000:80'
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - config-service
    restart: unless-stopped

  # Optional: If you want to build your React app in Docker too
  # react-build:
  #   image: node:18-alpine
  #   container_name: react-builder
  #   working_dir: /app
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   command: sh -c "npm install && npm run build"
  #   profiles: ["build"]

volumes:
  config-data:
