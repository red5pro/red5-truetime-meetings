# docker-compose.yml
#
# This is the app tier: safe to run once per meetings instance and scale
# out behind a load balancer (multiple node groups, multiple replicas).
#
# VITE_CONFIG_SERVICE_URL is optional:
# - Standalone deployments (no config-service) can leave it unset and pass
#   individual VITE_* vars instead - see README.md "Usage".
# - If a customer runs docker-compose.config-service.yml (once per
#   customer), set VITE_CONFIG_SERVICE_URL to that same shared instance on
#   every replica here so they all read/write the same config.json.
version: '3.8'

services:
  # Built from the repo root Dockerfile, which runs
  # ci/docker_startup_script.sh at container start to bake VITE_* vars
  # (including VITE_CONFIG_SERVICE_URL, if set) into the built JS.
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-nginx
    ports:
      - '3000:80'
    environment:
      - VITE_CONFIG_SERVICE_URL=${VITE_CONFIG_SERVICE_URL:-}
    restart: unless-stopped
